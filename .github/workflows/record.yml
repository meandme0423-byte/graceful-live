name: IG Live Auto Recorder

on:
  schedule:
    # 每 5 分钟自动检测一次开播状态
    - cron: '*/5 * * * *'
  workflow_dispatch: # 手动触发按钮

concurrency:
  group: ig-live-recording
  cancel-in-progress: false

jobs:
  check-and-record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install requests yt-dlp

      - name: Check and Record Stream
        env:
          IG_SESSION_ID: ${{ secrets.IG_SESSION_ID }}
          TARGET_USERNAME: ${{ secrets.TARGET_USERNAME }}
        run: |
          python record.py

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ig-live-${{ github.run_id }}
          path: ./*.mp4
          retention-days: 7 # 视频保留 7 天，过期自动清理
